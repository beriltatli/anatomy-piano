<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kuyruklu piyano</title><style>

.iso[data-theme="light"]{

.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}

.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}

.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}

.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}

.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}

@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}

.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

e uzunluk kazanmak için tenor tellerinin üstünden çapraz gerilir. Klavye ve aksiyon kasaya vidalı değildir: tek parça halinde çekmece gibi öne çekilip çıkarılır. Tek bir tuşun mekanizması Şekil 2'de.</span></figcaption></figure></section><div style="height:48px"></div><section id="fig-action"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Şekil 2</span><span class="iso-plate-corner" data-corner="title">Tek tuşun aksiyonu</span><span class="iso-plate-corner" data-corner="hint">Basılı tut · 1 2 3 vuruş gücü</span><span class="iso-plate-corner" data-corner="readout" data-readout>dinlenme · tuşa basın</span></div><div class="iso-stage" tabindex="0" role="button" aria-pressed="false" aria-label="Piyano tuşu: figüre basılı tutun ya da boşluk tuşunu basılı tutun. 1, 2, 3 tuşları vuruş gücünü p, mf, f yapar."><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 640 253" role="img" aria-label="Kuyruklu piyanonun tek tuşluk aksiyon modeli, yandan izometrik görünüş: tuş, kapstan, vipen, jak, tekrar kolu, kaçış düğmesi, çekiç, yakalayıcı, susturucu ve döküm çerçeveye gerilmiş üç tel. Tuşa basınca jak çekici fırlatır, düğmeye değip kaçar, çekiç tele vurup geri seker, yakalayıcı onu tutar; tuş yarıya dönünce tekrar kolu çekici havada tutar ve jak yerine oturur."><g data-layer="base"><path class="iso-halo" d="M17.7 142.5L17.7 142.1L18 141.6L36.7 120L37.2 119.5L38 119.1L38.9 118.8L39.9 118.6L41.1 118.4L42.3 118.3L43.6 118.3L44.8 118.4L617.9 188.2L619.1 188.4L620.1 188.6L621 189L621.6 189.4L622.1 189.8L622.3 190.3L622.3 205.1L622.3 205.6L622 206L603.3 227.7L602.8 228.1L602 228.5L601.1 228.8L600.1 229.1L598.9 229.2L597.7 229.3L596.4 229.3L595.2 229.2L22.1 159.4L20.9 159.2L19.9 159L19 158.6L18.4 158.2L17.9 157.8L17.7 157.3Z"/><g class="iso-solid"><path class="iso-fill" d="M43.9 140.3L43.9 139.8L44.2 139.2L44.8 138.8L45.6 138.3L46.6 138L47.8 137.7L49.1 137.5L50.5 137.4L   const s0 = side[0][0];

  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);

      const room = M.knuckleBottom(s.theta) - Math.max(M.jackTopZ(psi, next), M.jackTopZ(psi, 0));
      if (engagedNow || room > 0.05) s.tau = next;
    }

    // Hammer: gravity, the lever spring below its free height, the jack, the string and the backcheck.
    const thetaLever = leverFree(psi);
    if (!s.caught) {
      let accel = -M.HAMMER_G * Math.cos(s.theta);
      if (s.theta < thetaLever) accel += LEVER_LIFT * M.HAMMER_G - LEVER_DAMP * Math.min(0, s.omega) - 8 * s.omega;
      s.omega += accel * h;
      s.theta += s.omega * h;
      if (s.theta < thetaLever && s.theta > thetaLever - 0.002 && Math.abs(s.omega) < 0.05) { s.theta = thetaLever; s.omega = 0; }
    }
    const sup = jackSupport(s, psi);
    const supRate = (sup - s.supportPrev) / h;
    s.supportPrev = sup;
    if (!s.caught && s.theta < sup) {
      s.theta = sup;
      s.omega = Math.max(0, Math.min(supRate, 80));
    }
    const muTop = Math.min(0, M.muDropAt(psi));
    s.mu = s.theta < thetaLever ? Math.min(muTop, M.muKnuckle(psi, s.theta)) : muTop;
    if (wasEngaged && Math.abs(M.jackShift(s.tau)) >= M.ESCAPE && s.escapedAt < 0) {
      s.escapedAt = s.t;
      s.lastEscape = s.t;
      s.flying = true;
      s.events.push({ t: s.t, type: "escape" });
    }
    if (s.theta >= M.STRIKE) {
      s.theta = M.STRIKE;
      if (s.omega > 0) {
        s.strikeSpeed = (s.omega * M.crownRadius) / 1000;
        s.strikeAt = s.t;
        s.struck += 1;
        s.armed = true;
        s.flying = false;
        s.sound = Math.max(s.sound, Math.min(1, s.strikeSpeed / 4.5));
        s.events.push({ t: s.t, type: "strike", speed: s.strikeSpeed });
        s.omega = -M.REBOUND * s.omega;
      }
    }
    if (s.omega < 0) s.flying = false;
    if (!s.caught && s.omega < 0 && s.d > 1) {
      const thetaC = M.thetaCatch(s.d);
      const along = M.checkAlong(thetaC, s.d);
      if (s.theta <= thetaC && thetaC > Math.max(sup, M.REST - 0.1) && along > M.CHECK_SPAN[0] && along < M.CHECK_SPAN[1]) {
        s.caught = true;
        s.catchD = s.d;
        s.theta = thetaC;
        s.omega = 0;
        s.events.push({ t: s.t, type: "check" });
      }
    }
    if (s.caught) {
      const thetaC = M.thetaCatch(s.d);
      s.catchD = Math.max(s.catchD, s.d);
      if (s.catchD - s.d > RELEASE_CHECK || thetaC < sup) {
        s.caught = false;
        s.omega = 0;
        s.events.push({ t: s.t, type: "release" });
      } else s.theta = Math.max(thetaC, sup);
    }
    if (s.escapedAt >= 0 && Math.abs(M.jackShift(s.tau)) < M.ESCAPE * 0.98) s.escapedAt = -1;

    // Damper: lifted by the key's back end, falls under its own weight.
    const nuKey = M.underAngle(s.d);
    if (nuKey <= s.nu) s.nu = nuKey;
    else {
      const liftNow = M.damperLift(s.nu);
      const liftKey = M.damperLift(nuKey);
      const next = Math.max(liftKey, liftNow - DAMPER_FALL * h);
      s.nu = M.solve((a) => M.damperLift(a) - next, -0.3, 0.001);
      if (liftKey <= 0 && next <= 0) s.nu = 0;
    }
    s.lift = M.damperLift(s.nu);

    // Sound: a long decay while the damper is up, a quick one once its felt is back on the strings.
    const tauSound = s.lift > 0.25 ? 2.8 : 0.12;
    s.sound *= Math.exp(-h / tauSound);
    if (s.sound < 1e-3) s.sound = 0;

    s.phase = phaseOf(s, psi, Math.max(sup, thetaLever));
    return s;
  }

  function phaseOf(s, psi, sup) {
    const sinceStrike = s.strikeAt >= 0 ? s.t - s.strikeAt : Infinity;
    const thetaLever = leverFree(psi);
    if (s.d < 0.05 && s.target === 0) s.armed = false;
    if (sinceStrike < 0.004) return "strike";
    if (s.caught) return "check";
    const escaped = Math.abs(M.jackShift(s.tau)) >= M.ESCAPE;
    if (escaped) {
      if (s.flying && s.omega > 0.05) return "flight";
      if (s.omega > 0.05) return "lever";
      if (s.omega < -0.05) return s.strikeAt >= s.lastEscape ? "rebound" : "fall";
      if (s.theta < thetaLever - 0.002) return "lever";
      return "drop";
    }
    if (s.vd > 1e-6) return s.tau > 0.001 ? "letoff" : "press";
    if (s.armed && s.d > 0.5 && s.d < M.SPEC.dip - 0.05) return "repeat";
    if (s.vd < -1e-6) return "rise";
    if (s.d > 0.05) return "hold";
    if (s.lift < 0.2 && s.sound > 0.01) return "damp";
    return "rest";
  }

  return { create, step, SPEEDS };
}
// Every part of the action model, in painter's order. Static parts are built once by the
// build script; moving parts are rebuilt each frame in the page from the same functions.

function makeParts(k, G, P, M) {
  const at = (p) => k.iso(p, P);
  const S = (paths, style) => k.solidSvg(paths, style);
  const L = (d, style) => k.lineSvg(d, style);
  const D = (points, style) => k.dotsSvg(points, style);
  const FXZ = { o: [0, 0, 0], a: [0, 1, 0], u: [1, 0, 0], v: [0, 0, 1] };
  const bar = (poly, y0, y1, style = {}) => S(G.prismOf(FXZ, poly, y0, y1, P), style);
  const box = (x0, z0, x1, z1) => [[x0, z0], [x1, z0], [x1, z1], [x0, z1]];
  const xyz = ([x, z], y) => [x, y, z];
  const path = (points, closed = false) => k.pathOf(points.map(at), closed);
  const discY = ([x, z], r, y0, y1, style = {}) => S(G.disc(y0, y1, r, G.frameAlong([x, 0, z], [0, 1, 0]), P), style);
  const rod = (p0, p1, r, style = {}) => {
    const d = G.sub3(p1, p0);
    const len = G.len3(d);
    return S(G.disc(0, len, r, G.frameAlong(p0, G.unit3(d)), P), style);
  };
  const pin = ([x, z], y, r = 1.1) => S(G.disc(y, y + 0.5, r, G.frameAlong([x, 0, z], [0, 1, 0]), P), { tone: "lo", crease: "none" });
  const faceLine = (points, y, style) => L(path(points.map((p) => xyz(p, y))), style);
  const rotAll = (poly, f) => poly.map(f);
  const zig = (a, b, turns, width, y) => {
    const pts = [];
    const n = turns * 2;
    const dx = b[0] - a[0];
    const dz = b[1] - a[1];
    const len = Math.hypot(dx, dz);
    const nx = -dz / len;
    const nz = dx / len;
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const off = i === 0 || i === n ? 0 : (i % 2 ? 1 : -1) * width;
      pts.push([a[0] + dx * t + nx * off, a[1] + dz * t + nz * off]);
    }
    return faceLine(pts, y, { tone: "mid" });
  };

  const area = (pts) => pts.reduce((a, p, i) => { const q = pts[(i + 1) % pts.length]; return a + p[0] * q[1] - q[0] * p[1]; }, 0);
  function clipConvex(subject, clip) {
    const c = area(clip) < 0 ? [...clip].reverse() : clip;
    let out = area(subject) < 0 ? [...subject].reverse() : subject;
    for (let i = 0; i < c.length && out.length; i++) {
      const a = c[i];
      const b = c[(i + 1) % c.length];
      const inside = (p) => (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]) >= 0;
      const cross = (p, q) => {
        const d1 = (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]);
        const d2 = (b[0] - a[0]) * (q[1] - a[1]) - (b[1] - a[1]) * (q[0] - a[0]);

      };

      out = [];
      for (let j = 0; j < input.length; j++) {

  }

  // ── Fixed geometry ───────────────────────────────────────────────────────
  const BASE = { x: -30, y: -58, w: 770, d: 92, r: 8 };
  const RAIL_Y = [-24, 14];
  const PLATE_Y = [-44, -38];

    const screws = k.corners(BASE, 11);

    out.push(bar(rotAll(box(0, 16, 50, 38), f), -11, 11, { tone: "hi" }));

  const wipFn = (pose) => (p) => M.onWippen(p, pose.psi);

    out.push(bar(rotAll(box(330, 50.6, 344, 58.4), f), -4.4, 4.4, { tone: "hi" }));
    out.push(bar(rotAll([[293, 57.6], [394, 59.6], [397, 64], [394, 70], [293, 68]], f), -5, 5, { tone: "hi" }));
    out.push(pin(M.W, 5));
    out.push(bar(rotAll([[340, 68.5], [350, 68.8], [349, 96], [341, 96]], f), -5, -1, { tone: "hi" }));
    out.push(bar(rotAll([[318, 67.8], [330, 68], [330, 84], [318, 84]], f), -5, -1, { tone: "hi" }));
    out.push(bar(rotAll(box(318, 84, 330, 86), f), -5, -1, { tone: "mid" }));

  }

  const leverFn = (pose) => (p) => M.leverPoint(p, pose.psi, pose.mu);
  function lever(pose) {

    const w = wipFn(pose);
    const lit = pose.lit === "lever";
    const out = [];
    out.push(rod(xyz(f([326, 86.4]), -3), xyz(f([326, 94]), -3), 1.2, { tone: "mid" }));
    out.push(bar(rotAll([[322, 94], [394, 94], [397, 97], [394, 100], [322, 100]], f), -6, -1, { tone: "hi", lit }));
    const top = f([326, 100]);
    out.push(S(G.disc(0, 1.3, 2.2, G.frameAlong(xyz(top, -3.5), [-Math.sin(pose.psi + pose.mu), 0, Math.cos(pose.psi + pose.mu)]), P), { tone: "mid" }));
    out.push(pin(f(M.Q), -1));
    // Repetition spring: coiled on the flange post, one arm on the wippen, one under the lever.
    const coil = w([345, 88]);
    const ring = Array.from({ length: 25 }, (_, i) => [coil[0] + 2.3 * Math.cos((i / 24) * Math.PI * 2), coil[1] + 2.3 * Math.sin((i / 24) * Math.PI * 2)]);
    out.push(faceLine(ring, -0.7, { tone: "mid" }));
    out.push(faceLine([[coil[0] + 2.3, coil[1]], f([371, 94])], -0.7, { tone: "mid" }));
    out.push(faceLine([[coil[0] - 1.6, coil[1] - 1.6], w([340.4, 74])], -0.7, { tone: "mid" }));
    return out.join("");
  }

  const jackFn = (pose) => (p) => M.jackPoint(p, pose.psi, pose.tau);
  function jack(pose) {

    const w = wipFn(pose);
    const lit = pose.lit === "jack";
    const out = [];

// A 1.92 m grand piano, in millimetres, built to come apart in layers.
// Plan coordinates: u across the keyboard from bass (0) to treble (1490), v from the key fronts (0) to the tail.
// World: x = -v (the keyboard faces +x), y = 745 - u (bass at +y), z up from the floor.

function makePiano(k, G, P) {
  const W = 1490;
  const at = (p) => k.iso(p, P);
  const w3 = (u, v, z) => [-v, W / 2 - u, z];
  const fl = ([u, v]) => [-v, W / 2 - u];
  const S = (paths, style) => k.solidSvg(paths, style);
  const L = (d, style) => k.lineSvg(d, style);
  const D = (points, style) => k.dotsSvg(points, style);
  const V = G.viewOf(P);
  const path3 = (pts, closed = false) => k.pathOf(pts.map(at), closed);
  const ext = (uvRing, z, h, opts = {}) => k.extrude(uvRing.map(fl), z, h, P, opts);
  const rectUV = (u0, v0, u1, v1) => [[u0, v0], [u1, v0], [u1, v1], [u0, v1]];
  const slab = (u0, v0, u1, v1, z, h, style = {}, bevel = 0) => S(ext(rectUV(u0, v0, u1, v1), z, h, { bevel }), style);
  const lerp = (a, b, t) => a + (b - a) * t;

  // ── Plan ─────────────────────────────────────────────────────────────────
  const Z = { floor: 0, caseBottom: 620, keybed: 660, rimTop: 990, sound: 850, plateBand: [880, 905], front: [905, 935], strut: [945, 975], pinblock: [850, 900] };
  const bez = (p0, p1, p2, p3, n) => Array.from({ length: n + 1 }, (_, i) => {
    const t = i / n, s = 1 - t;
    return [s * s * s * p0[0] + 3 * s * s * t * p1[0] + 3 * s * t * t * p2[0] + t * t * t * p3[0], s * s * s * p0[1] + 3 * s * s * t * p1[1] + 3 * s * t * t * p2[1] + t * t * t * p3[1]];
  });
  const tail = Array.from({ length: 33 }, (_, i) => {
    const a = Math.PI - (i / 32) * (Math.PI + 0.1745);
    return [320 + 320 * Math.cos(a), 1600 + 320 * Math.sin(a)];
  });
  const end = tail[tail.length - 1];
  const bent = bez(end, [end[0] - 51, end[1] - 294], [1490, 900], [1490, 600], 28).slice(1);
  // The rim, as an open path from the bass cheek round the tail to the treble cheek.
  const RIM_OUT = [[0, 150], [0, 1000], [0, 1600], ...tail.slice(1), ...bent, [1490, 380], [1490, 150]];
  const offset = (pts, d) => pts.map((p, i) => {
    const a = pts[Math.max(0, i - 1)];
    const b = pts[Math.min(pts.length - 1, i + 1)];
    const du = b[0] - a[0], dv = b[1] - a[1];
    const len = Math.hypot(du, dv) || 1;
    return [p[0] + (dv / len) * d, p[1] - (du / len) * d];
  });
  const RIM_IN = offset(RIM_OUT, 40);
  const cutAt = (pts, v0) => {
    // The part of a rim path behind v0, with its two ends placed exactly on v = v0.
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const q = pts[i + 1];
      if (p[1] >= v0) out.push(p);
      if (q && (p[1] - v0) * (q[1] - v0) < 0) {
        const t = (v0 - p[1]) / (q[1] - p[1]);
        out.push([lerp(p[0], q[0], t), v0]);
      }
    }
    return out;
  };

  // Split the rim into the walls that face the viewer and those that face away.
  function rimPieces() {
    const n = RIM_OUT.length;
    const near = [];
    for (let i = 0; i < n - 1; i++) {
      const [a, b] = [fl(RIM_OUT[i]), fl(RIM_OUT[i + 1])];
      const dx = b[0] - a[0], dy = b[1] - a[1];
      // Outward normal. The plan keeps the interior on its right in (u, v), and the map to world is a mirror.
      const len = Math.hypot(dx, dy) || 1;
      const nx = dy / len, ny = -dx / len;
      near.push(nx * V[0] + ny * V[1] > 0);
    }
    const runs = [];
    let start = 0;
    for (let i = 1; i <= near.length; i++) {
      if (i === near.length || near[i] !== near[start]) { runs.push({ near: near[start], from: start, to: i }); start = i; }
    }
    return runs.map((r) => {
      const outer = RIM_OUT.slice(r.from, r.to + 1);
      const inner = RIM_IN.slice(r.from, r.to + 1);
      return { near: r.near, ring: [...outer, ...inner.reverse()] };
    });
  }
  const RIMS = rimPieces();

  function rim(nearSide) {
    const out = [];
    for (const piece of RIMS.filter((r) => r.near === nearSide)) {
      out.push(S(ext(piece.ring, Z.caseBottom, Z.rimTop - Z.caseBottom, { convex: false }), { tone: "hi" }));
    }
    if (nearSide) {
      // A gold-leaf line runs along the rim top, as on real cases.
      const inner = RIMS.filter((r) => r.near).map((r) => r.ring.slice(0, r.ring.length / 2).map(([u, v]) => w3(u, v, Z.rimTop - 22)));
      for (const line of inner) out.push(L(path3(line), { tone: "lo", className: "pa-goldline" }));
    }
    return out.join("");
  }

  // Cheeks (key blocks), keybed and the dark interior seen from above.
  const KEYS = { u0: 134, white: 23.5, n: 52 };
  KEYS.u1 = KEYS.u0 + KEYS.white * KEYS.n;
  function caseFront(nearSide) {
    const out = [];
    if (!nearSide) {
      out.push(slab(0, 0, W, 700, Z.caseBottom, Z.keybed - Z.caseBottom, { tone: "hi" }));
      out.push(slab(0, 0, KEYS.u0, 150, Z.keybed, 110, { tone: "hi" }, 1.2));
    } else {
      out.push(slab(KEYS.u1, 0, W, 150, Z.keybed, 110, { tone: "hi" }, 1.2));
    }
    return out.join("");
  }
  const INNER = cutAt(RIM_IN, 150);
  function interior() {
    const out = [];
    const ring = INNER.map(([u, v]) => at(w3(u, v, Z.caseBottom)));
    out.push(`<path class="iso-shade" data-shade="0" d="${k.pathOf(ring, true)}"/>`);
    // Braces under the soundboard, fanning from the belly rail to the rim.
    const BRACES = [[[300, 420], [190, 1720]], [[620, 420], [560, 1560]], [[900, 420], [930, 1180]], [[1200, 420], [1380, 760]]];
    for (const [[u0, v0], [u1, v1]] of BRACES) {
      const du = u1 - u0, dv = v1 - v0, len = Math.hypot(du, dv);
      const nu = (-dv / len) * 22, nv = (du / len) * 22;
      out.push(S(ext([[u0 - nu, v0 - nv], [u0 + nu, v0 + nv], [u1 + nu, v1 + nv], [u1 - nu, v1 - nv]], Z.caseBottom, 70), { tone: "mid", className: "pa-wood" }));
    }
    out.push(slab(45, 380, W - 45, 420, Z.caseBottom, 200, { tone: "mid", className: "pa-wood" }));
    return out.join("");
  }

  // ── Soundboard and bridges ───────────────────────────────────────────────
  const SB_V = 400;
  const SB = cutAt(RIM_IN, SB_V);

  // Strings: 88 notes; the lowest 20 are copper-wound and overstrung across the tenor.
  const NOTES = 88;
  const PIN_V = [205, 255];
  const HITCH = offset(cutAt(RIM_IN, SB_V), 62);
  const hitchHit = (o, d) => {
    let best = null;
    for (let i = 0; i < HITCH.length - 1; i++) {
      const a = HITCH[i], b = HITCH[i + 1];
      const ex = b[0] - a[0], ey = b[1] - a[1];
      const den = d[0] * ey - d[1] * ex;
      if (Math.abs(den) < 1e-9) continue;
      const t = ((a[0] - o[0]) * ey - (a[1] - o[1]) * ex) / den;
      const s = ((a[0] - o[0]) * d[1] - (a[1] - o[1]) * d[0]) / den;
      if (t > 50 && s >= 0 && s <= 1 && (!best || t < best)) best = t;
    }
    return best ? [o[0] + d[0] * best, o[1] + d[1] * best] : null;
  };
  const STRINGS = Array.from({ length: NOTES }, (_, i) => {
    const n = i + 1;
    const bass = n <= 20;
    const u = bass ? lerp(150, 520, i / 19) : lerp(560, 1380, (n - 21) / 67);
    const ang = bass ? lerp(0.42, 0.3, i / 19) : lerp(-0.02, 0.06, (n - 21) / 67);
    const d = [Math.sin(ang), Math.cos(ang)];
    const start = [u, 330];
    const stop = hitchHit(start, d);
    const len = Math.hypot(stop[0] - start[0], stop[1] - start[1]);
    const bridge = [start[0] + d[0] * (len - 70), start[1] + d[1] * (len - 70)];
    return { n, bass, pin: [u, PIN_V[n % 2]], start, stop, bridge, len };
  });
  const STRING_Z = { pin: 948, agraffe: 940, bridge: 902, hitch: 906, over: 14 };

  function bridgeBand(points, width) {
    const left = offset(points, -width / 2);
    const right = offset(points, width / 2);
    return [...left, ...right.reverse()];
  }
  function soundboard() {
    const out = [];
    out.push(S(ext(SB, Z.sound - 9, 9, { convex: false }), { tone: "hi", className: "pa-spruce" }));
    // Grain: thin lines clipped to the board, running along the spruce at 40 degrees.
    const grain = [];
    const dir = [Math.cos(0.7), Math.sin(0.7)];
    for (let c = -1800; c < 1800; c += 46) {
      const o = [745 + -dir[1] * c, 1100 + dir[0] * c];
      const hits = [];
      for (let i = 0; i < SB.length; i++) {
        const a = SB[i], b = SB[(i + 1) % SB.length];
        const ex = b[0] - a[0], ey = b[1] - a[1];
        const den = dir[0] * ey - dir[1] * ex;
        if (Math.abs(den) < 1e-9) continue;
        const t = ((a[0] - o[0]) * ey - (a[1] - o[1]) * ex) / den;
        const s = ((a[0] - o[0]) * dir[1] - (a[1] - o[1]) * dir[0]) / den;
        if (s >= 0 && s < 1) hits.push(t);
      }
      hits.sort((p, q) => p - q);
      for (let j = 0; j + 1 < hits.length; j += 2) {
        const p0 = [o[0] + dir[0] * hits[j], o[1] + dir[1] * hits[j]];
        const p1 = [o[0] + dir[0] * hits[j + 1], o[1] + dir[1] * hits[j + 1]];
        grain.push(path3([w3(...p0, Z.sound), w3(...p1, Z.sound)]));
      }
    }
    out.push(L(grain.join(""), { tone: "faint" }));
    const treble = STRINGS.filter((s) => !s.bass).map((s) => s.bridge);
    const bass = STRINGS.filter((s) => s.bass).map((s) => s.bridge);
    out.push(S(ext(bridgeBand(treble, 30), Z.sound, STRING_Z.bridge - Z.sound, { convex: false }), { tone: "hi", className: "pa-wood" }));
    out.push(S(ext(bridgeBand(bass, 34), Z.sound, STRING_Z.bridge + STRING_Z.over - Z.sound, { convex: false }), { tone: "hi", className: "pa-wood" }));
    out.push(D([...treble, ...bass].map(([u, v], i) => at(w3(u, v, STRING_Z.bridge + (i >= treble.length ? STRING_Z.over : 0)))), { size: 0.35, tone: "lo" }));
    return out.join("");
  }

  function pinblock() {
    const seams = [0.25, 0.5, 0.75].map((t) => path3([w3(W - 45, lerp(150, 330, t), Z.pinblock[1]), w3(W - 45, lerp(150, 330, t), Z.pinblock[0])]));
    const out = [S(ext(rectUV(45, 150, W - 45, 330), Z.pinblock[0], Z.pinblock[1] - Z.pinblock[0], { bevel: 1 }), { tone: "hi", className: "pa-wood", inner: L(seams.join(""), { tone: "faint" }) })];
    const pins = STRINGS.map((s) => path3([w3(s.pin[0], s.pin[1], Z.pinblock[1]), w3(s.pin[0], s.pin[1], STRING_Z.pin + 8)])).join("");
    out.push(D(STRINGS.map((s) => at(w3(s.pin[0], s.pin[1], Z.pinblock[1]))), { size: 0.6, tone: "lo" }));
    out.push(L(pins, { tone: "mid" }));
    out.push(D(STRINGS.map((s) => at(w3(s.pin[0], s.pin[1], STRING_Z.pin + 8))), { size: 0.75, tone: "mid" }));
    return out.join("");
  }

  function strings() {
    const steel = [];
    const copper = [];
    for (const s of STRINGS) {
      const lift = s.bass ? STRING_Z.over : 0;
      const pts = [w3(s.pin[0], s.pin[1], STRING_Z.pin), w3(s.start[0], s.start[1], STRING_Z.agraffe + lift), w3(s.bridge[0], s.bridge[1], STRING_Z.bridge + lift), w3(s.stop[0], s.stop[1], STRING_Z.hitch + lift)];
      (s.bass ? copper : steel).push(path3(pts));
    }
    // Red stringing felt woven behind the hitch pins and in front of the agraffes.
    const felt = STRINGS.filter((s) => !s.bass).map((s) => w3(s.stop[0] - Math.sin(0.02) * 30, s.stop[1] - 30, STRING_Z.hitch + 1));
    // Each string ends in a coil at its tuning pin and a loop round its hitch pin.
    const ends = STRINGS.flatMap((s) => [at(w3(s.pin[0], s.pin[1], STRING_Z.pin)), at(w3(s.stop[0], s.stop[1], STRING_Z.hitch + (s.bass ? STRING_Z.over : 0)))]);
    return L(steel.join(""), { tone: "hi", className: "pa-steel" }) + L(path3(felt), { tone: "lo", className: "pa-felt" }) + L(copper.join(""), { tone: "hi", className: "pa-copper" }) + D(ends, { size: 0.55, tone: "mid" });
  }

  // ── Cast-iron plate ──────────────────────────────────────────────────────
  const PLATE_OUT = offset(cutAt(RIM_IN, 330), 8);
  const PLATE_IN = offset(cutAt(RIM_IN, 330), 128);
  function plateBand(nearSide) {
    // The band is cut into the half that faces the viewer and the half that doesn't, like the rim.
    const ring = [...PLATE_OUT, ...[...PLATE_IN].reverse()];
    return S(ext(ring, Z.plateBand[0], Z.plateBand[1] - Z.plateBand[0], { convex: false }), { tone: "hi", className: "pa-gold" });
  }
  const STRUTS = [[[300, 330], [330, 1740]], [[560, 330], [520, 1560]], [[840, 330], [860, 1280]], [[1130, 330], [1250, 980]]];
  function plate() {
    const out = [plateBand()];
    out.push(slab(45, 150, W - 45, 330, Z.front[0], Z.front[1] - Z.front[0], { tone: "hi", className: "pa-gold" }, 1.2));
    // Round lightening holes along the band, like the photographs.
    const holes = [];
    for (const t of [0.12, 0.24, 0.36, 0.5, 0.64, 0.78, 0.9]) {
      const i = Math.round(t * (PLATE_OUT.length - 1));
      const [u, v] = [(PLATE_OUT[i][0] + PLATE_IN[i][0]) / 2, (PLATE_OUT[i][1] + PLATE_IN[i][1]) / 2];
      const ring = Array.from({ length: 28 }, (_, j) => w3(u + 34 * Math.cos((j / 28) * Math.PI * 2), v + 34 * Math.sin((j / 28) * Math.PI * 2), Z.plateBand[1]));
      holes.push(`<path class="iso-shade" data-shade="0" d="${path3(ring, true)}"/>`);
      holes.push(L(path3(ring, true), { tone: "mid" }));
    }
    out.push(holes.join(""));
    for (const [[u0, v0], [u1, v1]] of STRUTS) {
      const du = u1 - u0, dv = v1 - v0, len = Math.hypot(du, dv);
      const nu = (-dv / len) * 26, nv = (du / len) * 26;
      out.push(S(ext([[u0 - nu, v0 - nv], [u0 + nu, v0 + nv], [u1 + nu, v1 + nv], [u1 - nu, v1 - nv]], Z.strut[0], Z.strut[1] - Z.strut[0]), { tone: "hi", className: "pa-gold" }));
      for (const [u, v] of [[u0, v0], [u1, v1]]) out.push(S(k.cylinder(...fl([u, v]), 30, Z.plateBand[1], Z.strut[0] - Z.plateBand[1], P, 28), { tone: "hi", className: "pa-gold" }));
    }
    // Hitch pins at the band and agraffe studs along the front bar.
    out.push(D(STRINGS.map((s) => at(w3(s.stop[0], s.stop[1], Z.plateBand[1]))), { size: 0.55, tone: "mid" }));
    out.push(D(STRINGS.map((s) => at(w3(s.start[0], s.start[1] - 8, Z.front[1]))), { size: 0.6, tone: "mid" }));
    // Oval openings for the tuning pins in the front bar.
    const ovals = [];
    for (let g = 0; g < 8; g++) {
      const u0 = lerp(120, 1330, g / 7);
      const ring = Array.from({ length: 24 }, (_, j) => w3(u0 + 60 * Math.cos((j / 24) * Math.PI * 2), 230 + 42 * Math.sin((j / 24) * Math.PI * 2), Z.front[1]));
      ovals.push(L(path3(ring, true), { tone: "lo" }));
    }
    out.push(ovals.join(""));
    return out.join("");
  }

  // ── Keyboard and action: one drawer ─────────────────────────────────────
  function drawer() {
    const out = [];
    out.push(slab(KEYS.u0 - 4, 20, KEYS.u1 + 4, 520, Z.keybed, 15, { tone: "mid", className: "pa-wood" }));
    out.push(slab(KEYS.u0, 150, KEYS.u1, 480, Z.keybed + 15, 22, { tone: "hi", className: "pa-wood" }));
    const lines = [];
    for (let i = 1; i < 88; i++) {
      const u = lerp(KEYS.u0, KEYS.u1, i / 88);
      lines.push(path3([w3(u, 150, Z.keybed + 37), w3(u, 480, Z.keybed + 37)]));
    }
    out.push(L(lines.join(""), { tone: "faint" }));
    out.push(D(Array.from({ length: 88 }, (_, i) => at(w3(lerp(KEYS.u0, KEYS.u1, (i + 0.5) / 88), 300, Z.keybed + 37))), { size: 0.4, tone: "lo" }));
    // White keys: one ivory row with the gaps between keys cut across its top and front.
    const kz = Z.keybed + 42;
    const gaps = [];
    for (let i = 1; i < KEYS.n; i++) {
      const u = KEYS.u0 + i * KEYS.white;
      gaps.push(path3([w3(u, 150, kz), w3(u, 0, kz), w3(u, 0, kz - 27)]));
    }
    out.push(S(ext(rectUV(KEYS.u0, 0, KEYS.u1, 150), Z.keybed + 15, 27, { bevel: 0.6 }), { tone: "hi", className: "pa-ivory", inner: L(gaps.join(""), { tone: "lo" }) }));
    const blacks = [];
    const PATTERN = [1, 1, 0, 1, 1, 1, 0];
    for (let i = KEYS.n - 2; i >= 0; i--) {
      // A0 starts the keyboard; its octave pattern begins at A (A#, then B has none).
      const note = (i + 5) % 7;
      if (!PATTERN[note]) continue;
      const u = KEYS.u0 + (i + 1) * KEYS.white;
      blacks.push(slab(u - 6.5, 50, u + 6.5, 150, Z.keybed + 42, 12, { tone: "hi", className: "pa-lacquer" }, 0.4));
    }
    out.push(blacks.join(""));
    // Action: brackets, wippen rail, hammer flange rail, 88 shanks and hammer heads.
    for (const t of [0.02, 0.27, 0.52, 0.76, 0.98]) {
      const u = lerp(KEYS.u0, KEYS.u1, t);
      out.push(slab(u - 6, 230, u + 6, 400, Z.keybed + 15, 150, { tone: "mid", className: "pa-wood" }));
    }
    out.push(slab(KEYS.u0, 240, KEYS.u1, 270, Z.keybed + 60, 14, { tone: "mid", className: "pa-wood" }));
    out.push(slab(KEYS.u0, 236, KEYS.u1, 262, 830, 18, { tone: "mid", className: "pa-wood" }));
    const shanks = [];
    for (let i = 0; i < 88; i++) {
      const u = lerp(KEYS.u0, KEYS.u1, (i + 0.5) / 88);
      shanks.push(path3([w3(u, 262, 846), w3(u, 352, 852)]));
    }
    out.push(L(shanks.join(""), { tone: "mid" }));
    const heads = [];
    for (let i = 87; i >= 0; i--) {
      const u = lerp(KEYS.u0, KEYS.u1, (i + 0.5) / 88);
      heads.push(slab(u - 5.5, 348, u + 5.5, 372, 840, 46, { tone: "hi", className: "pa-felt-head" }));
    }
    out.push(heads.join(""));
    return out.join("");
  }

  // ── Legs, lyre and pedals ────────────────────────────────────────────────
  const LEGS = [[[70, 80], 0], [[1420, 80], 1], [[330, 1740], 2]];
  function leg([u, v]) {
    const [x, y] = fl([u, v]);
    const F = G.frameOf([x, y, 0], [0, 0, 1], [1, 0, 0], [0, 1, 0]);
    const out = [];
    out.push(S(G.solidOf([[0, 0.1], [6, 34, 1], [14, 38, 1], [26, 30, 1], [40, 0.1]], G.frameOf([x, y, 0], [0, 0, 1], [1, 0, 0], [0, 1, 0]), P), { tone: "hi", className: "pa-brass" }));
    const prof = [[40, 46], [70, 50, 1], [110, 46, 1], [160, 40], [480, 52], [540, 60, 1], [580, 62, 1], [620, 62]];
    out.push(S(G.solidOf(prof, F, P), { tone: "hi", className: "pa-lacquer" }));
    out.push(L(G.arcOf(F, 160, 40, P) + G.arcOf(F, 480, 52, P), { tone: "lo" }));
    return out.join("");
  }
  function lyre() {
    const out = [];
    const u0 = 745;
    out.push(slab(u0 - 110, 400, u0 + 110, 470, 40, 80, { tone: "hi", className: "pa-lacquer" }, 0.8));

    const face = faceUp ? top : bottom;
    const back = faceUp ? bottom : top;
    const parts = [];
    const fill = [k.pathOf(face.map(at), true)];
    const edges = [];
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;

      const along = G.sub3(top[j], top[i]);

  }

  const lidBottom = LID.map(([u, v]) => w3(u, v, Z.rimTop));
  const PROP_BASE = (() => {

  function prop(angle) {

  function desk(t) {

    const ring = LID.map(([u, v]) => w3(u, v, 0));

  }

  const BOX = {
    piano: [[0, 0, 0], [W, 1920, Z.rimTop + 22]],
    lidOpen: [[0, 150, Z.rimTop], [W, 1920, Z.rimTop + Math.sin(1.0) * W]],
    plate: [[45, 150, Z.plateBand[0]], [W - 45, 1880, Z.strut[1]]],
    strings: [[45, 150, STRING_Z.hitch], [W - 45, 1880, STRING_Z.pin + 10]],
    soundboard: [[40, SB_V, Z.sound - 9], [W - 40, 1880, STRING_Z.bridge + STRING_Z.over]],
    pinblock: [[45, 150, Z.pinblock[0]], [W - 45, 330, STRING_Z.pin + 8]],
    drawer: [[KEYS.u0, 0, Z.keybed], [KEYS.u1, 520, 890]],
  };

    const out = [];
    for (const u of [u0, u1]) for (const v of [v0, v1]) for (const z of [z0, z1]) { const p = w3(u, v, z); out.push([p[0] + dx, p[1], p[2] + dz]); }
    return out;
  };

  return {
    W, Z, w3, fl, rim, caseFront, interior, soundboard, pinblock, strings, plate, drawer, leg, lyre, LEGS, lid, prop, fallboard, desk, floorHalo,
    BOX, boxPoints, KEYS, STRINGS, RIM_TOP: Z.rimTop,
  };
}
